# Identité de l'API Gateway
spring.application.name=api-gateway
server.port=8086
# Configuration Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Logs du routage et du Load Balancing
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Routage dynamique vers Stock-service
spring.cloud.gateway.server.webflux.routes[0].id=stock-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://stock-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/stocks/**