# MS5 - Notifications et messagerie   (nom dans Eureka : NOTIFICATION-SERVICE)
spring.application.name=notification-service
server.port=8085

# ============ Base MongoDB (notification_db) ============
spring.data.mongodb.uri=mongodb://localhost:27017/notification_db

# ============ Atelier 1 : enregistrement dans Eureka ============
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Identifiant unique par instance (2e instance : -Dserver.port=...)
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============ Atelier 2 : Spring Boot Actuator ============
# Endpoints exposés (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Détail des composants dans /actuator/health
management.endpoint.health.show-details=always
# Transmettre à Eureka le statut de /actuator/health (UP / DOWN)
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info
management.info.env.enabled=true

# Informations publiées dans /actuator/info (lien de l'instance dans le dashboard Eureka)
info.app.name=notification-service
info.app.version=1.0.0
info.app.description=MS5 - Notifications et messagerie
info.app.team=GenerationZ
